<script>
const $=id=>document.getElementById(id);
const nf=(n,d=2)=>n.toLocaleString('en-ZA',{minimumFractionDigits:d,maximumFractionDigits:d});
const R=n=>'R '+nf(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kf=v=>Math.abs(v)>=1000?(v/1000).toFixed(1)+'k':String(Math.round(v));
const hs=s=>{let x=5381;for(const c of s)x=(x*33^c.charCodeAt(0))>>>0;return String(x)};
const SUBJ=["Mathematics","Accounting","Economics","Business Studies","Physical Sciences","Life Sciences"],AB=["Math","Acc","Eco","BS","PS","LS"];
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],TM=["15:00","16:30","18:00"],K='nova_forge_v2';
let U=[],B=[],ME=null,PARAS=[],stream=null;
const S={v:'home',t:'browse',reg:true,role:'student',p:{r:15,c:25,F:800,k:10},inc:true,msg:null,bk:null,rep:null,bid:null};
const load=()=>{try{const j=JSON.parse(localStorage.getItem(K));if(j){U=j.U||[];B=j.B||[]}}catch(e){}};load();
try{ME=sessionStorage.getItem('nf_me')}catch(e){}
if(!U.length)U=[['Thabo M.',SUBJ[0],220,'thabo'],['Lerato K.',SUBJ[1],260,'lerato'],['Sipho N.',SUBJ[2],250,'sipho']].map((a,i)=>({id:'d'+i,role:'tutor',name:a[0],email:a[3]+'@novaforge.demo',pw:hs('nova123'),subject:a[1],rate:a[2],av:{d:[1,2,3,4,5],t:TM}}));
const save=()=>{try{localStorage.setItem(K,JSON.stringify({U,B}));ME?sessionStorage.setItem('nf_me',ME):sessionStorage.removeItem('nf_me')}catch(e){}};
const me=()=>U.find(u=>u.id===ME),usr=id=>U.find(u=>u.id===id);
const fd=d=>new Date(d+'T12:00').toLocaleDateString('en-ZA',{weekday:'short',day:'numeric',month:'short'});
const vat=()=>S.p.r/100;
const avg=t=>{const r=B.filter(b=>b.tid===t.id&&b.rating).map(b=>b.rating);return r.length?r.reduce((a,b)=>a+b,0)/r.length:0};
function slots(t){const o=[];for(let i=1;i<30&&o.length<15;i++){const d=new Date();d.setDate(d.getDate()+i);if(!t.av.d.includes(d.getDay()))continue;
 const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 t.av.t.forEach(h=>{if(!B.some(b=>b.tid===t.id&&b.d===k&&b.h===h&&b.status!=='declined'))o.push([k,h])})}return o.slice(0,15)}
const luhn=s=>{let t=0,d=false;for(let i=s.length-1;i>=0;i--){let n=+s[i];if(d){n*=2;if(n>9)n-=9}t+=n;d=!d}return t%10===0};
const msg=()=>S.msg?`<p class="msg ${S.msg[0]}" role="alert">${S.msg[1]}</p>`:'';

function chart(labels,vals,fmt,xt,yt){
 const W=640,H=280,L=56,Bm=44,T=16,Rr=12,w=W-L-Rr,h=H-T-Bm,mx=Math.max(0,...vals),mn=Math.min(0,...vals),sp=(mx-mn)||1,y=v=>T+h*(1-(v-mn)/sp),bw=w/vals.length;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${yt} by ${xt}">`;
 for(let i=0;i<=4;i++){const v=mn+sp*i/4,yy=y(v);s+=`<line x1="${L}" x2="${W-Rr}" y1="${yy}" y2="${yy}" stroke="#D5DDEA"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="#4A5873">${fmt(v)}</text>`}
 vals.forEach((v,i)=>{const x0=L+i*bw+bw*.15;s+=`<rect x="${x0}" y="${Math.min(y(v),y(0))}" width="${bw*.7}" height="${Math.max(Math.abs(y(v)-y(0)),1)}" fill="${v<0?'#B5423A':'#0B6E8A'}"><title>${labels[i]}: ${fmt(v)}</title></rect><text x="${x0+bw*.35}" y="${H-Bm+16}" text-anchor="middle" font-size="11" fill="#4A5873">${labels[i]}</text>`});
 return s+`<line x1="${L}" x2="${W-Rr}" y1="${y(0)}" y2="${y(0)}" stroke="#14213D"/><text x="${L+w/2}" y="${H-6}" text-anchor="middle" font-size="12" fill="#14213D">${xt}</text><text transform="rotate(-90 12 ${T+h/2})" x="12" y="${T+h/2}" text-anchor="middle" font-size="12" fill="#14213D">${yt}</text></svg>`}

/* ---------- insights and report ---------- */
const SAMPLE=[8,9,7,10,6,9,8,7,9,10,5,8,9,7,8].map((r,i)=>({s:SUBJ[i%6],p:[220,260,250,240,260,240][i%6],r}));
function calc(){
 const P=S.p,r=P.r/100,c=P.c/100,F=P.F,k=P.k;
 let A=B.filter(b=>b.status==='approved'||b.status==='done').map(b=>{const t=usr(b.tid);return{s:t.subject,p:t.rate,r:b.rating||0}});
 if(S.inc)A=SAMPLE.concat(A);const n=A.length;if(!n)return null;
 const rev=A.reduce((a,b)=>a+b.p,0),pb=rev/n,vt=r*rev,com=c*rev,prof=com-F,be=c*pb>0?Math.ceil(F/(c*pb)):null;
 const fr=[['Sessions','n',n],['Mean price per session','p̄ = Rev ÷ n',R(pb)],['Revenue (excl. VAT)','Rev = Σp',R(rev)],['VAT','V = r · Rev',R(vt)],['Paid by students','Rev(1 + r)',R(rev+vt)],['Platform commission','c · Rev',R(com)],['Tutor payouts','(1 − c) · Rev',R(rev-com)],['Profit this month','P = c · Rev − F',R(prof)],['Break-even sessions','x* = ⌈F ÷ (c · p̄)⌉',be===null?'none':be]];
 const d=A.map(b=>b.r).filter(v=>v>0).sort((a,b)=>a-b),m=d.length;let sr=[],ST=null;
 if(m){const mean=d.reduce((a,b)=>a+b,0)/m,med=m%2?d[(m-1)/2]:(d[m/2-1]+d[m/2])/2,hi=d.filter(v=>v>=8).length;ST={m,mean,med,rg:d[m-1]-d[0],mn:d[0],mx:d[m-1],pc:hi/m*100};
  sr=[['Number of ratings','n',m],['Mean','x̄ = Σx ÷ n',nf(mean)],['Median','middle of the sorted list',nf(med)],['Range','max − min = '+d[m-1]+' − '+d[0],ST.rg],['Rated 8 or higher','count ≥ 8 ÷ n × 100',nf(ST.pc,1)+'%']]}
 const cnt=SUBJ.map(s=>A.filter(b=>b.s===s).length),lab=[],val=[];let tot=0;
 for(let i=1;i<=12;i++){const x=Math.max(0,Math.round(n+k*(i-1))),p=c*pb*x-F;lab.push('M'+i);val.push(p);tot+=p}
 PARAS=[`Nova Forge is an online tutoring platform. Monthly profit P is a linear function of the independent variable x, the number of sessions, with parameters commission c = ${nf(c*100,1)}%, fixed cost F = ${R(F)}, VAT rate r = ${nf(r*100,1)}% and mean session price p̄ = ${R(pb)}. So P(x) = c · p̄ · x − F.`,
 `The platform recorded n = ${n} sessions (discrete values) with revenue ${R(rev)} excluding VAT. VAT is ${R(vt)}, students paid ${R(rev+vt)}, the commission is ${R(com)} and the profit is ${R(prof)}. `+(be===null?'There is no break-even point.':`The break-even point is x* = ${be} sessions.`),
 `With growth of k = ${k} sessions per month, total profit over 12 months is ${R(tot)}.`,
 ST?`The ${ST.m} session ratings have a mean of ${nf(ST.mean)}, a median of ${nf(ST.med)} and a range of ${ST.rg} (${ST.mn} to ${ST.mx}). ${nf(ST.pc,1)}% of ratings were 8 or higher.`:'No session ratings have been recorded yet.',
 'Constraints: x is a non-negative whole number and 0 ≤ r, c ≤ 1.'];
 return{fr,sr,cnt,lab,val}}
const tbl=(a,h)=>`<div class="scroll"><table><thead><tr><th>${h}</th><th>Expression</th><th>Value</th></tr></thead><tbody>${a.map(x=>`<tr><td>${x[0]}</td><td class="f">${x[1]}</td><td><b>${x[2]}</b></td></tr>`).join('')}</tbody></table></div>`;
function ins(){const D=calc(),P=S.p;
 return `<h2>Insights</h2><p class="lead">Every figure comes from the sessions and ratings on this site.</p>
<div class="card"><div class="grid"><label>VAT rate r (%)<input type="number" data-p="r" value="${P.r}" min="0" max="100"></label><label>Commission c (%)<input type="number" data-p="c" value="${P.c}" min="0" max="100"></label><label>Fixed cost F per month (R)<input type="number" data-p="F" value="${P.F}" min="0"></label><label>Growth k (sessions per month)<input type="number" data-p="k" value="${P.k}"></label></div>
<label class="ck" style="margin-top:10px"><input type="checkbox" data-inc="1" ${S.inc?'checked':''}>Include 15 sample sessions with ratings</label></div>`+
 (D?`<h3 style="margin-top:16px">Finance</h3>${tbl(D.fr,'Quantity')}<h3>Rating statistics</h3>${D.sr.length?tbl(D.sr,'Statistic'):'<p>No ratings yet.</p>'}
<div class="card"><h3>Sessions per subject</h3>${chart(AB,D.cnt,v=>String(Math.round(v)),'Subject','Sessions')}<p class="note">Math = Mathematics, Acc = Accounting, Eco = Economics, BS = Business Studies, PS = Physical Sciences, LS = Life Sciences.</p></div>
<div class="card" style="margin-top:12px"><h3>Profit growth over 12 months</h3>${chart(D.lab,D.val,kf,'Month','Profit (R)')}<p class="note">P(x<sub>i</sub>) = c · p̄ · x<sub>i</sub> − F, where x<sub>i</sub> = n + k(i − 1).</p></div>`:'<p>No sessions yet. Include the sample data or complete a booking.</p>')}
function report(){calc();return `<h2>Project report summary</h2><p class="lead">Written automatically from the Insights figures.</p><div class="card">${PARAS.map(t=>`<p>${t}</p>`).join('')||'<p>No sessions to report on yet.</p>'}</div>
<div class="noprint"><button class="btn" data-act="print">Print or save as PDF</button><button class="btn alt" data-act="copy" id="cp">Copy text</button></div>
<h3 style="margin-top:18px">Mathematical terms used</h3><div class="card"><p><b>Independent variable:</b> x, sessions per month. <b>Dependent variable:</b> P(x), monthly profit. <b>Parameters:</b> r, c, F, k and each tutor's rate. <b>Linear function:</b> P(x) = c · p̄ · x − F. <b>Constraints:</b> x ≥ 0 and 0 ≤ r, c ≤ 1. <b>Discrete values:</b> sessions and ratings are whole numbers.</p></div>
<p class="note">Group: Ramalebane J.P, Noko P.A.S, Kunene S.L.A, Vuma M, Mguni M.E, Nemamilwe A, Shozi S, Bapela M, Chauke R.N</p>`}

function render(){const m=me();
 $('nav').innerHTML=`<b>Nova Forge</b>`+[['home','Home'],['dash','Dashboard'],['ins','Insights'],['report','Report']].map(a=>`<button class="tab" aria-selected="${S.v===a[0]}" data-act="go" data-v="${a[0]}">${a[1]}</button>`).join('')+(m?`<span class="who">${esc(m.name)} (${m.role})</span><button class="tab" data-act="logout">Log out</button>`:'');
 $('app').innerHTML=({home,auth,dash,live,ins,report}[S.v]||home)();
 if(S.v==='live')wb()}
function wb(){const c=$('wb'),x=c.getContext('2d');let d=false;x.lineWidth=3;x.lineCap='round';x.strokeStyle='#14213D';
 const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{d=true;const[a,b]=p(e);x.beginPath();x.moveTo(a,b);c.setPointerCapture(e.pointerId)};
 c.onpointermove=e=>{if(!d)return;const[a,b]=p(e);x.lineTo(a,b);x.stroke()};c.onpointerup=()=>d=false}
function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}

const act={
 go(d){S.v=d.v;S.msg=null;render()},
 role(d){S.role=d.r;S.reg=true;S.msg=null;S.v='auth';render()},

  if(!n||!e.includes('@')||p.length<6)return S.msg=['err','Enter your name, a valid email and a password of 6 or more characters.'],render();

  const rt=t?+$('cr').value:0;if(t&&(rt<50||rt>1000))return S.msg=['err','Choose a rate between R50 and R1000.'],render();
  U.push(t?{id:'u'+Date.now(),role:'tutor',name:n,email:e,pw:hs(p),subject:$('cs').value,rate:rt,av:{d:[1,2,3,4,5],t:TM}}:{id:'u'+Date.now(),role:'student',name:n,email:e,pw:hs(p),grade:$('cg').value});
  save();S.reg=true;S.pre=e;S.msg=['ok','Account created. Log in to continue.'];render()},
 login(){const u=U.find(x=>x.role===S.role&&x.email===$('le').value.trim().toLowerCase()&&x.pw===hs($('lp').value));
  if(!u)return S.msg=['err','Email or password is not correct.'],render();
  ME=u.id;save();S.v='dash';S.t=u.role==='student'?'browse':'req';S.msg=null;render()},

 tab(d){S.t=d.t;S.msg=null;S.bk=null;render()},
 book(d){S.bk={tid:d.id,step:1};S.msg=null;render()},
 cancelbk(){S.bk=null;render()},
 topay(){const v=$('sl').value.split('|');S.bk.d=v[0];S.bk.h=v[1];S.bk.step=2;render()},
 pay(){const cc=$('cc').value.replace(/\s/g,''),ex=$('ce2').value.trim().match(/^(\d{2})\/(\d{2})$/),cv=$('cv').value;let bad='';
  if(!/^\d{13,19}$/.test(cc)||!luhn(cc))bad='The card number is not valid.';
  else if(!ex||+ex[1]<1||+ex[1]>12||new Date(2000+ +ex[2],+ex[1],0,23,59)<new Date())bad='The expiry date is not valid or has passed.';
  else if(!/^\d{3}$/.test(cv))bad='The CVV must be 3 digits.';
  if(bad)return S.msg=['err',bad+' Check the details and try again.'],render();
  const t=usr(S.bk.tid);B.push({id:Date.now(),sid:ME,tid:t.id,d:S.bk.d,h:S.bk.h,status:'pending'});save();
  S.bk=null;S.t='mine';S.msg=['ok','Payment accepted. Your booking is confirmed and matched to '+esc(t.name)+'. Waiting for approval.'];render()},
 appr(d){const b=B.find(x=>String(x.id)===d.id);b.status=d.y==='1'?'approved':'declined';save();S.msg=['ok',d.y==='1'?'Request approved. The student has been notified.':'Request declined. Next request shown.'];render()},
 join(d){S.bid=+d.id;S.v='live';render()},
 cam(){const v=$('vid');(navigator.mediaDevices?navigator.mediaDevices.getUserMedia({video:true}):Promise.reject()).then(s=>{stream=s;v.srcObject=s;v.play()}).catch(()=>$('cm').textContent='Camera is not available or permission was denied.')},
 wclear(){const c=$('wb');c.getContext('2d').clearRect(0,0,c.width,c.height)},
 leave(){stop();const b=B.find(x=>x.id===S.bid),m=me();S.v='dash';if(m.role==='student'){b.att=true;S.t='mine'}else{S.t='sess';S.rep=b.id}save();render()},
 rate(d){const b=B.find(x=>String(x.id)===d.id);b.rating=+$('rt'+d.id).value;b.fb=$('fb'+d.id).value.trim();save();render()},
 repo(d){S.rep=+d.id;render()},
 reps(d){const b=B.find(x=>String(x.id)===d.id),t=$('rtp').value.trim(),n=$('rnt').value.trim(),s=+$('rsc').value;
  if(!t||!n||s<0||s>10)return S.msg=['err','Add the topic, feedback and a score from 0 to 10.'],render();
  b.report={topic:t,notes:n,score:s};b.status='done';S.rep=null;save();S.msg=['ok','Report sent to the student dashboard.'];render()},
 psave(){const m=me(),r=+$('pr').value,d=[...document.querySelectorAll('.pd:checked')].map(x=>+x.value),t=[...document.querySelectorAll('.pt:checked')].map(x=>x.value);
  if(r<50||r>1000||!d.length||!t.length)return S.msg=['err','Choose a rate from R50 to R1000, at least one day and at least one time.'],render();
  m.subject=$('ps').value;m.rate=r;m.av={d,t};save();S.msg=['ok','Profile saved. Students can now book your free slots.'];render()},
 print(){window.print()},
 copy(){const b=$('cp');(navigator.clipboard?navigator.clipboard.writeText(PARAS.join('\n\n')):Promise.reject()).then(()=>b.textContent='Copied').catch(()=>b.textContent='Copy failed');setTimeout(()=>b.textContent='Copy text',1800)}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a&&act[a.dataset.act]){load();act[a.dataset.act](a.dataset)}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.chg){S[t.dataset.chg]=t.value;render()}
 if(t.dataset.p){S.p[t.dataset.p]=parseFloat(t.value)||0;render()}
 if(t.dataset.inc){S.inc=t.checked;render()}});
const sync=()=>{load();const a=document.activeElement;if(!a||!/INPUT|TEXTAREA|SELECT/.test(a.tagName))render()};
window.addEventListener('storage',e=>{if(e.key===K)sync()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
render();
</script>
<button id="themeBtn" type="button" aria-label="Switch to dark mode"></button>
<script>
(function(){
 const r=document.documentElement,b=document.getElementById('themeBtn'),mq=window.matchMedia('(prefers-color-scheme: dark)');
 let st=null;try{st=localStorage.getItem('nf_theme')}catch(e){}
 const apply=t=>{r.dataset.theme=t;b.textContent=t==='dark'?'☀️':'🌙';const n=t==='dark'?'light':'dark';b.setAttribute('aria-label','Switch to '+n+' mode');b.title='Switch to '+n+' mode';const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#0A0E18':'#EEF3FB'};
 apply(st||(mq.matches?'dark':'light'));
 b.addEventListener('click',()=>{st=r.dataset.theme==='dark'?'light':'dark';apply(st);try{localStorage.setItem('nf_theme',st)}catch(e){}});
 if(mq.addEventListener)mq.addEventListener('change',e=>{if(!st)apply(e.matches?'dark':'light')});
})();
</script>
